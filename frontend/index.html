
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Acadêmico DS II</title>

    <link rel="stylesheet" href="./css/estilo.css">

    <script src="./js/model/aluno-model.js" defer></script>
    <script src="./js/view/aluno-view.js" defer></script>
    <script src="./js/controller/aluno-controller.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div class="container">
            <h1>Sistema Acadêmico DS II</h1>
            <p>Versão 0.2 - cadastro de alunos com DOM e eventos</p>
        </div>
    </header>

    <main class="container">
        <!-- Cadastro de alunos -->
        <section class="cartao">
            <h2>Cadastro de aluno</h2>
            <p>Preencha os campos abaixo para cadastrar um aluno.</p>

            <form id="form-aluno" novalidate>
                <div class="grade-formulario">

                    <div class="campo">
                        <label for="ra">RA</label>
                        <input
                            type="text"
                            id="ra"
                            name="ra"
                            placeholder="Exemplo: 2026001"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Nome completo"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="aluno@email.com"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="curso">Curso</label>
                        <input
                            type="text"
                            id="curso"
                            name="curso"
                            placeholder="Exemplo: DSM"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="turma">Turma</label>
                        <input
                            type="text"
                            id="turma"
                            name="turma"
                            placeholder="Exemplo: 2 DSM"
                            required
                        >
                    </div>
                </div>

                <button type="submit">
                    Cadastrar aluno
                </button>
            </form>

            <div
                id="mensagem"
                class="mensagem"
                role="status"
                aria-live="polite">
            </div>
        </section>

        <!-- Lista de alunos -->
        <section class="cartao">
            <div class="titulo-secao">
                <h2>Alunos cadastrados</h2>
                <p id="total-alunos">Total: 0</p>
            </div>

            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>RA</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Curso</th>
                            <th>Turma</th>
                            <th>Situação</th>
                        </tr>
                    </thead>

                    <tbody id="corpo-tabela-alunos">
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Representação JSON -->
        <section class="cartao">
            <h2>Representação em JSON</h2>
            <p>A lista abaixo é atualizada após cada cadastro.</p>
            <pre id="saida-json">[]</pre>
        </section>
    </main>
</body>
</html>
